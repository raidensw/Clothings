[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splash"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/server/:splash"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
